name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copiar o app web para dentro do APK
        run: |
          ./build.sh
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TreinoDoPredio.apk

      - name: Publicar versão para download
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Treino do Prédio 1.0.${{ github.run_number }}
          body: |
            Baixe o arquivo **TreinoDoPredio.apk** abaixo pelo navegador do celular Android e toque nele para instalar.
            Na primeira vez, o Android pede para permitir a instalação de apps do navegador.
          files: TreinoDoPredio.apk
          make_latest: true
