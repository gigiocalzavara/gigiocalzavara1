<title>Treino do Prédio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna (máx 560px), barra superior com nível/XP, abas fixas embaixo, folhas (sheets) sobrepostas. */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --surface2:#e9edf1; --line:#d5dbe2;
  --fg:#12171c; --muted:#5a6672; --accent:#e5600c; --accent-ink:#ffffff;
  --xp:#b98200; --good:#1f8f5a; --bad:#d23c41; --led:#e3262b;
  --fig:#1d252d; --fig-far:#9aa6b2; --metal:#6b7682; --metal2:#b7c0c9;
  --red:#d9363e; --blue:#2f6fe4; --green:#1f8f5a; --grey:#7d8893; --orange:#e5600c;
  --shadow:0 10px 30px rgba(18,23,28,.12);
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1115; --surface:#161b21; --surface2:#1e252d; --line:#2a323c;
  --fg:#e8ecf0; --muted:#8a96a3; --accent:#ff7a2f; --accent-ink:#1b0c02;
  --xp:#ffc53d; --good:#3fbf7f; --bad:#ff5a5f; --led:#ff3b30;
  --fig:#e8ecf0; --fig-far:#5b6672; --metal:#7e8996; --metal2:#3a444f;
  --red:#ef4f56; --blue:#4d86ff; --green:#36b273; --grey:#a2acb6; --orange:#ff7a2f;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1115; --surface:#161b21; --surface2:#1e252d; --line:#2a323c;
  --fg:#e8ecf0; --muted:#8a96a3; --accent:#ff7a2f; --accent-ink:#1b0c02;
  --xp:#ffc53d; --good:#3fbf7f; --bad:#ff5a5f; --led:#ff3b30;
  --fig:#e8ecf0; --fig-far:#5b6672; --metal:#7e8996; --metal2:#3a444f;
  --red:#ef4f56; --blue:#4d86ff; --green:#36b273; --grey:#a2acb6; --orange:#ff7a2f;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.15rem}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

.shell{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.lvl{width:44px;height:44px;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.35rem;color:var(--accent-ink);background:var(--accent);clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}
.xpwrap{flex:1;min-width:0}
.xpline{display:flex;justify-content:space-between;gap:8px;font-size:.8rem}
.xpline b{font-family:var(--f-display);font-size:1rem;letter-spacing:.02em}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--xp));border-radius:inherit;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.streak{display:flex;align-items:center;gap:4px;font-family:var(--f-display);font-weight:700;font-size:1.2rem;color:var(--accent)}
.streak svg{width:22px;height:22px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted)}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent)}

/* generic blocks */
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;gap:12px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--surface2);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;font-family:var(--f-display);font-size:1.3rem;letter-spacing:.04em;text-transform:uppercase;min-height:56px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:600;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tag svg{width:14px;height:14px}
.tag{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

/* hero (home) */
.hello h1{font-size:2.3rem}
.lvcard{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:92px;height:92px}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--surface2)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s}
.ring text{fill:var(--fg);font-family:var(--f-display);font-weight:800}
.next{background:var(--fg);color:var(--bg);border:0}
.next .muted{color:color-mix(in srgb,var(--bg) 65%,var(--fg))}
.next .tag{background:color-mix(in srgb,var(--bg) 14%,var(--fg));color:var(--bg)}
.exthumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.exthumbs .fig{width:64px;height:64px;flex:none;border-radius:10px;background:var(--surface2)}
.mission{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mission:first-of-type{border-top:0}
.mission .bar{grid-column:1/-1}
.mission .xp{font-family:var(--f-display);font-weight:700;color:var(--xp)}
.mission.done .bar>i{background:var(--good)}
.mission.done .xp{color:var(--good)}

/* figure */
.fig{display:block;width:100%;height:auto;aspect-ratio:1;max-width:100%}
.fig .floor{stroke:var(--line);stroke-width:2}
.fig .n{stroke:var(--fig)} .fig .f{stroke:var(--fig-far)}
.fig .hl{stroke:var(--accent)}
.fig .head{fill:var(--fig)}
.fig .lim{fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .pr{fill:var(--metal2);stroke:none}
.fig .pr2{fill:var(--metal);stroke:none}
.fig .cab{stroke:var(--metal);stroke-width:1.4;fill:none;stroke-dasharray:3 2}
.fig .eq{fill:var(--metal);stroke:var(--metal)}
.fig .ghost{opacity:.18}

/* library */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:520px){.grid2{grid-template-columns:repeat(3,minmax(0,1fr))}}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.excard .fig{background:var(--surface2);border-radius:10px}
.excard b{font-family:var(--f-display);font-size:1.05rem;line-height:1.1;font-weight:700}

/* workout */
.sess-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.combo{font-family:var(--f-display);font-weight:800;color:var(--xp);font-size:1.1rem}
.exw{padding:0;overflow:hidden}
.exw.done{border-color:var(--good)}
.exw-top{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px;align-items:center}
.exw-top .fig{background:var(--surface2);border-radius:10px}
.exw-top h3{font-size:1.25rem}
.presc{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.presc .tag{font-size:.8rem}
.up{background:color-mix(in srgb,var(--good) 18%,transparent)!important;color:var(--good)!important}
.sets{border-top:1px solid var(--line);padding:8px 12px 12px;display:flex;flex-direction:column;gap:6px}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 52px;gap:8px;align-items:center}
.setrow .sn{font-family:var(--f-display);font-weight:700;color:var(--muted);text-align:center}
.setrow label{display:flex;align-items:center;gap:6px;background:var(--surface2);border-radius:10px;padding:0 10px;min-width:0}
.setrow input{width:100%;min-width:0;border:0;background:transparent;padding:10px 0;font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
.setrow input:focus{outline:none}
.setrow label:focus-within{outline:2px solid var(--accent)}
.setrow small{color:var(--muted);font-size:.75rem}
.chk{width:52px;height:44px;border-radius:10px;border:2px solid var(--line);background:transparent;display:grid;place-items:center}
.chk svg{width:22px;height:22px;stroke:var(--muted)}
.chk[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.chk[aria-pressed="true"] svg{stroke:#fff}
.setrow.ok .sn{color:var(--good)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:0}

/* sheets / modals */
.scrim{position:fixed;inset:0;background:rgba(5,8,12,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow);animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(40px);opacity:.4}}
.sheet .x{float:right;background:var(--surface2);border:0;border-radius:50%;width:36px;height:36px;font-size:1.2rem;line-height:1}
.detail-fig{background:var(--surface2);border-radius:16px;max-width:320px;margin:8px auto 12px}
ol.steps{padding-left:1.3em;margin:6px 0 0;display:flex;flex-direction:column;gap:6px}
ul.tips{padding-left:1.1em;margin:6px 0 0;display:flex;flex-direction:column;gap:4px}
.sec{margin-top:16px}
.sec h3{font-size:1rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* rest timer */
.rest{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;justify-content:center;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.rest .in{pointer-events:auto;background:#0b0d10;color:#fff;border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:14px;width:100%;max-width:536px;box-shadow:var(--shadow)}
.led{font-family:"Courier New",monospace;font-weight:700;font-size:2.4rem;color:var(--led);text-shadow:0 0 12px color-mix(in srgb,var(--led) 60%,transparent);letter-spacing:.06em;font-variant-numeric:tabular-nums;line-height:1}
.rest .lbl{flex:1;min-width:0;font-size:.85rem;color:#b9c2cb}
.rest .lbl b{display:block;color:#fff;font-size:1rem}
.rest .btn{background:#252b33;color:#fff}

/* toast + xp pop */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;box-shadow:var(--shadow);max-width:calc(100% - 32px);animation:drop .3s ease}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
.pop{position:fixed;z-index:55;font-family:var(--f-display);font-weight:800;font-size:1.4rem;color:var(--xp);pointer-events:none;animation:pop 1s ease-out forwards;text-shadow:0 2px 8px rgba(0,0,0,.3)}
@keyframes pop{to{transform:translateY(-60px);opacity:0}}
canvas#confetti{position:fixed;inset:0;z-index:70;pointer-events:none;width:100%;height:100%}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .v{font-family:var(--f-display);font-weight:800;font-size:1.9rem;line-height:1}
.tile .v small{font-size:.9rem;font-weight:600;color:var(--muted);margin-left:3px}
.tile .k{font-size:.8rem;color:var(--muted);margin-top:4px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--surface2);display:block}
.heat i.l1{background:color-mix(in srgb,var(--accent) 45%,var(--surface2))}
.heat i.l2{background:var(--accent)}
.heat i.today{outline:2px solid var(--fg);outline-offset:-2px}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:480px){.badges{grid-template-columns:repeat(4,minmax(0,1fr))}}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:10px 4px;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-width:0}
.badge .hex{width:52px;height:52px;display:grid;place-items:center;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);background:var(--surface2)}
.badge .hex svg{width:26px;height:26px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge.on .hex{background:var(--c,var(--accent))}
.badge.on .hex svg{stroke:#fff}
.badge b{font-size:.8rem;line-height:1.15}
.badge small{font-size:.7rem;color:var(--muted);line-height:1.2}
.badge:not(.on){opacity:.6}
.prlist .r{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.prlist .r:first-child{border-top:0}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-weight:600;font-size:.9rem}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.goalcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.goal{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.goal b{font-family:var(--f-display);font-size:1.2rem}
.goal small{color:var(--muted);line-height:1.25}
.goal[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.kv:first-child{border-top:0}
.kv b{font-family:var(--f-display);font-size:1.35rem;font-weight:700;text-align:right}
.kv small{grid-column:1/-1;color:var(--muted);font-size:.8rem}
textarea.inp{min-height:110px;font-family:ui-monospace,monospace;font-size:.75rem}
.note{font-size:.8rem;color:var(--muted)}
.result-xp{font-family:var(--f-display);font-weight:800;font-size:3.4rem;color:var(--xp);line-height:1;text-align:center}
.breakdown .r{display:flex;justify-content:space-between;padding:6px 0;border-top:1px dashed var(--line)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="shell">
  <header class="top" id="top"></header>
  <main id="view" class="stack"></main>
</div>
<nav class="tabs" aria-label="Seções"><div class="in" id="tabs"></div></nav>
<div id="layer"></div>

<script>
"use strict";
/* ============================================================
   ÍCONES
============================================================ */
const IC = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  dumb:'<path d="M2 9v6M5 6v12M19 6v12M22 9v6M5 12h14"/>',
  list:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/>',
  flame:'<path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-3-1-6 1-9z"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4c0 3 2 4 4 4M16 6h4c0 3-2 4-4 4M12 13v4M8 21h8M9 17h6v4H9z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
  crown:'<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',
  moon:'<path d="M20 15A8 8 0 1 1 9 4a6 6 0 0 0 11 11z"/>',
  weight:'<path d="M6 8h12l2 12H4zM9 8a3 3 0 0 1 6 0"/>',
  compass:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
  play:'<path d="M7 4l13 8-13 8z"/>',
};
const icon=(k,cls='')=>`<svg viewBox="0 0 24 24" class="${cls}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;

/* ============================================================
   EXERCÍCIOS — somente com o equipamento da academia do prédio:
   rack de halteres coloridos, estação de polias (crossover) com barra,
   cadeira extensora, caneleiras, bola suíça, colchonete, esteiras, elíptico.
   Poses: A = início, B = fim. h=quadril, t=inclinação do tronco (0=em pé),
   a/a2=mãos, f/f2=pés, eb/kb=lado da dobra do cotovelo/joelho, fv=vista de frente.

function ik(p,t,a,b,s){
  let dx=t[0]-p[0],dy=t[1]-p[1],d=Math.hypot(dx,dy)||1;const m=a+b-.01;
  if(d>m){t=[p[0]+dx/d*m,p[1]+dy/d*m];d=m}

  const base=Math.atan2(dy,dx),A=Math.acos(Math.min(1,Math.max(-1,(a*a+d*d-b*b)/(2*a*d))));

function startRest(sec,nextLabel){stopRest();const end=Date.now()+sec*1000;const d=document.createElement('div');d.className='rest';d.id='rest';
  d.innerHTML=`<div class="in" role="timer" aria-live="off"><span class="led" id="restv">${mmss(sec)}</span><div class="lbl">Descanso<b>${esc(nextLabel)}</b></div><button class="btn sm" id="rest15">+15s</button><button class="btn sm" id="restskip">Pular</button></div>`;
  document.body.appendChild(d);let e2=end;
  $('#rest15').onclick=()=>{e2+=15000};$('#restskip').onclick=stopRest;
  restT=setInterval(()=>{const left=Math.max(0,Math.round((e2-Date.now())/1000));const el=$('#restv');if(el)el.textContent=mmss(left);
    if(left===3)beep(520,.1);if(left<=0){beep(880,.25,2);stopRest();toast('Bora! Próxima série.')}},250)}
function stopRest(){clearInterval(restT);restT=null;$('#rest')?.remove()}
const mmss=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

function e1rm(w,r){return w*(1+r/30)}
function finishWorkout(){
  const A=S.active,done=A.items.flatMap(it=>it.sets.filter(s=>s.done).map(s=>({ex:it.id,w:EX[it.id].load?+s.w||0:0,r:+s.r||0})));
  if(!done.length&&!A.cardio.done){toast('Marque pelo menos uma série ou o cardio antes de finalizar.');return}
  stopRest();
  const L0=levelInfo().l,complete=A.items.every(it=>it.sets.every(s=>s.done)),prs=[];
  for(const it of A.items){const ds=it.sets.filter(s=>s.done);if(!ds.length)continue;const ex=EX[it.id];
    const best=ds.reduce((b,s)=>{const sc=ex.load?e1rm(+s.w||0,+s.r||0):+s.r||0;return sc>b.sc?{sc,w:+s.w||0,r:+s.r||0}:b},{sc:-1});
    const old=S.prs[it.id];if(!old||best.sc>old.sc+1e-6){if(old)prs.push({ex:it.id,w:best.w,r:best.r});S.prs[it.id]={sc:best.sc,w:best.w,r:best.r,date:todayISO()}}
    if(ex.load){const hit=ds.length===it.sets.length&&ds.every(s=>(+s.r||0)>=it.pr.hi);const w=Math.max(...ds.map(s=>+s.w||0));S.last[it.id]={w,r:Math.min(...ds.map(s=>+s.r||0)),hit}}
    else S.last[it.id]={r:Math.min(...ds.map(s=>+s.r||0))}}
  const cardio=A.cardio.done?A.cardio.min:0;
  const st=streakWeeks(),mult=1+.1*Math.min(st,5);
  const parts=[['Séries e aquecimento',A.xp],['Treino concluído',50]];
  if(complete)parts.push(['Todas as séries',30]);if(prs.length)parts.push([`${prs.length} recorde(s)`,25*prs.length]);if(cardio)parts.push([`${cardio} min de cardio`,cardio*2]);
  const sub=parts.reduce((s,p)=>s+p[1],0),total=Math.round(sub*mult);
  if(mult>1)parts.push([`Bônus sequência ×${mult.toFixed(1)}`,total-sub]);
  const h={date:new Date().toISOString(),key:A.key,n:A.n,sets:done,cardio,complete,prs,xp:total,min:Math.round((Date.now()-A.started)/6e4)};
  S.history.push(h);S.xp+=total;S.rot++;S.active=null;
  const mis=claimAll(),ach=checkAch();
  const extra=mis.reduce((s,m)=>s+m.xp,0);
  save();try{wakeLock?.release()}catch(e){}
  const L=levelInfo();
  route='home';render();confetti();beep(784,.15,3);
  openSheet(`<button class="x" data-close aria-label="Fechar">×</button>
   <p class="eyebrow">Treino concluído · ${h.min} min</p><h2 style="font-size:2rem">${esc(h.n)}</h2>
   <div class="result-xp num" style="margin:16px 0 4px">+${total+extra} XP</div>
   ${L.l>L0?`<p style="text-align:center;font-family:var(--f-display);font-size:1.5rem;font-weight:800;color:var(--accent)">SUBIU PARA O NÍVEL ${L.l}! · ${esc(L.title)}</p>`:`<p class="muted" style="text-align:center">Faltam ${L.need-L.cur} XP para o nível ${L.l+1}</p>`}
   <div class="breakdown" style="margin-top:14px">${parts.map(p=>`<div class="r"><span>${p[0]}</span><b class="num">+${p[1]}</b></div>`).join('')}${mis.map(m=>`<div class="r"><span>Missão: ${esc(m.n)}</span><b class="num">+${m.xp}</b></div>`).join('')}
   <div class="r"><span>Volume levantado</span><b class="num">${fmt(volume(h))} kg</b></div><div class="r"><span>Maior combo</span><b class="num">×${A.best}</b></div></div>
   ${prs.length?`<div class="sec"><h3>Novos recordes</h3><ul class="tips">${prs.map(p=>`<li>${esc(EX[p.ex].n)}: <b class="num">${EX[p.ex].load?p.w+' kg × '+p.r:p.r+(EX[p.ex].type==='hold'?' s':' reps')}</b></li>`).join('')}</ul></div>`:''}
   ${ach.length?`<div class="sec"><h3>Conquistas desbloqueadas</h3><div class="badges" style="margin-top:8px">${ach.map(badge).join('')}</div></div>`:''}
   <button class="btn primary big" data-close style="margin-top:18px">Fechar</button>`);
}

function viewProg(){
  const H=S.history,vol=H.reduce((s,h)=>s+volume(h),0),car=H.reduce((s,h)=>s+(h.cardio||0),0),prc=H.reduce((s,h)=>s+(h.prs||[]).length,0);
  // heatmap 12 semanas
  const days=new Set(H.map(h=>todayISO(new Date(h.date))));const start=new Date(weekKey());start.setDate(start.getDate()-77);
  let heat='';for(let d=0;d<7;d++)for(let w=0;w<12;w++){const x=new Date(start);x.setDate(start.getDate()+w*7+d);const k=todayISO(x);const n=H.filter(h=>todayISO(new Date(h.date))===k).length;heat+=`<i class="${n>1?'l2':n?'l1':''} ${k===todayISO()?'today':''}" title="${k}"></i>`}
  // barras semanais
  const wc=weekCounts(),wks=[];for(let i=7;i>=0;i--){const k=weekKey(new Date(Date.now()-i*7*DAY));wks.push([k,wc[k]||0])}
  const maxW=Math.max(S.profile.days,...wks.map(w=>w[1]));
  const bw=300/8,bars=wks.map(([k,n],i)=>{const hh=n/maxW*90;return`<rect x="${20+i*bw+6}" y="${110-hh}" width="${bw-12}" height="${hh}" rx="3" fill="${n>=S.profile.days?'var(--accent)':'var(--metal)'}"/><text x="${20+i*bw+bw/2}" y="124" text-anchor="middle">${k.slice(8,10)}/${k.slice(5,7)}</text>`}).join('');
  const gy=110-S.profile.days/maxW*90;
  $('#view').innerHTML=`<section><p class="eyebrow">Desde ${new Date(S.profile.start).toLocaleDateString('pt-BR')}</p><h1>Progresso</h1></section>
  <div class="tiles">
   <div class="tile"><div class="v num">${H.length}</div><div class="k">treinos feitos</div></div>
   <div class="tile"><div class="v num">${fmt(vol/1000,1)}<small>t</small></div><div class="k">volume total levantado</div></div>
   <div class="tile"><div class="v num">${car}<small>min</small></div><div class="k">de cardio</div></div>
   <div class="tile"><div class="v num">${prc}</div><div class="k">recordes batidos</div></div></div>
  <section class="card"><h2>Treinos por semana</h2><p class="muted" style="font-size:.85rem">Laranja = meta de ${S.profile.days} batida</p>
   <svg class="chart" viewBox="0 0 330 130" role="img" aria-label="Treinos nas últimas 8 semanas"><line class="gl" x1="20" x2="320" y1="110" y2="110"/><line x1="20" x2="320" y1="${gy}" y2="${gy}" stroke="var(--accent)" stroke-dasharray="4 3"/><text x="16" y="${gy+3}" text-anchor="end">${S.profile.days}</text>${bars}</svg></section>
  <section class="card"><h2>Calendário</h2><p class="muted" style="font-size:.85rem;margin-bottom:8px">Últimas 12 semanas (cada coluna é uma semana, de segunda a domingo)</p><div class="heat">${heat}</div></section>
  ${healthProgCard()}
  <section class="card stack"><div><h2>Peso corporal</h2><p class="muted" style="font-size:.85rem">Pese-se sempre no mesmo horário, de preferência de manhã.</p></div>${weightChart()}
   <form id="wf" class="row"><input class="inp num" id="wkg" type="number" inputmode="decimal" step="0.1" min="30" max="250" placeholder="Peso de hoje (kg)" aria-label="Peso de hoje em kg"><button class="btn primary" type="submit">Registrar</button></form></section>
  <section class="card"><h2>Recordes pessoais</h2><div class="prlist" style="margin-top:8px">${Object.keys(S.prs).length?Object.entries(S.prs).map(([id,r])=>`<div class="r"><span>${esc(EX[id].n)}</span><b class="num">${EX[id].load?r.w+' kg × '+r.r:r.r+(EX[id].type==='hold'?' s':' reps')}</b></div>`).join(''):'<p class="muted">Seus recordes aparecem aqui depois do primeiro treino.</p>'}</div></section>
  <section class="card"><h2>Conquistas <span class="muted num" style="font-size:1rem">${Object.keys(S.ach).length}/${ACH.length}</span></h2><div class="badges" style="margin-top:10px">${ACH.map(badge).join('')}</div></section>
  ${H.length?`<section class="card"><h2>Histórico</h2><div class="prlist" style="margin-top:8px">${H.slice(-10).reverse().map(h=>`<div class="r"><span>${esc(h.n)}<br><small class="muted">${new Date(h.date).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'})} · ${h.sets.length} séries${h.cardio?' · '+h.cardio+' min cardio':''}</small></span><b class="num" style="color:var(--xp)">+${h.xp} XP</b></div>`).join('')}</div></section>`:''}`;
  $('#wf').onsubmit=e=>{e.preventDefault();const kg=parseFloat($('#wkg').value.replace(',','.'));if(!(kg>=30&&kg<=250)){toast('Digite um peso entre 30 e 250 kg.');return}
    const t=todayISO(),ex=S.weights.find(w=>w.date===t);if(ex)ex.kg=kg;else S.weights.push({date:t,kg});S.weights.sort((a,b)=>a.date.localeCompare(b.date));S.profile.weight=kg;
    const mis=claimAll(),ach=checkAch();save();render();toast(mis.length?`Peso registrado! Missão concluída: +${mis[0].xp} XP`:'Peso registrado.');if(ach.length)confetti()}}
function weightChart(){const W=S.weights.slice(-20);if(W.length<2)return`<p class="muted">Registre seu peso em dias diferentes para ver o gráfico. Último: <b class="num">${W.length?fmt(W[W.length-1].kg,1)+' kg':'—'}</b></p>`;
  const ks=W.map(w=>w.kg),tg=S.profile.target;let lo=Math.min(...ks,tg||Infinity),hi=Math.max(...ks,tg||-Infinity);const pad=Math.max(.5,(hi-lo)*.15);lo-=pad;hi+=pad;
  const X=i=>34+i*(286/(W.length-1)),Y=k=>10+(hi-k)/(hi-lo)*100;
  const pts=W.map((w,i)=>`${X(i).toFixed(1)},${Y(w.kg).toFixed(1)}`).join(' ');
  const ticks=[hi-pad,(hi+lo)/2,lo+pad].map(v=>`<line class="gl" x1="34" x2="320" y1="${Y(v)}" y2="${Y(v)}"/><text x="30" y="${Y(v)+3}" text-anchor="end">${fmt(v,1)}</text>`).join('');
  const last=W[W.length-1],diff=last.kg-W[0].kg;
  return`<div class="row between"><span class="muted">${fmt(diff,1)} kg desde ${new Date(W[0].date+'T12:00').toLocaleDateString('pt-BR')}</span><b class="num" style="font-family:var(--f-display);font-size:1.4rem">${fmt(last.kg,1)} kg</b></div>
  <svg class="chart" viewBox="0 0 330 124" role="img" aria-label="Evolução do peso">${ticks}${tg?`<line x1="34" x2="320" y1="${Y(tg)}" y2="${Y(tg)}" stroke="var(--good)" stroke-dasharray="4 3"/><text x="320" y="${Y(tg)-4}" text-anchor="end" style="fill:var(--good)">meta ${fmt(tg,1)}</text>`:''}
  <polygon points="34,110 ${pts} 320,110" fill="var(--accent)" opacity=".12"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${X(W.length-1)}" cy="${Y(last.kg)}" r="4.5" fill="var(--accent)"/>
  <text x="34" y="122">${W[0].date.slice(8,10)}/${W[0].date.slice(5,7)}</text><text x="320" y="122" text-anchor="end">${last.date.slice(8,10)}/${last.date.slice(5,7)}</text></svg>`}

/* ============================================================
   SAÚDE · Samsung Health (opcional)
   Páginas web não acessam o Samsung Health diretamente. O app lê os
   arquivos de "Baixar dados pessoais" do Samsung Health (CSV ou .zip),
   guarda só os resumos diários e usa nos cálculos e na gamificação.

const EXTYPES={1001:'Caminhada',1002:'Corrida',11007:'Ciclismo',13001:'Trilha',14001:'Natação',15006:'Elíptico',10007:'Musculação',1000:'Treino',0:'Exercício'};
function splitCSV(l){const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];
  if(q){if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
  else if(ch==='"')q=true;else if(ch===','){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out}
function parseCSV(text){const lines=text.replace(/\r/g,'').split('\n').filter(l=>l.trim().length);if(lines.length<2)return[];
  const hi=/start_time|day_time|create_time|update_time/.test(lines[0])?0:1;
  const head=splitCSV(lines[hi]).map(h=>h.trim().split('.').pop());
  return lines.slice(hi+1).map(l=>{const c=splitCSV(l),o={};head.forEach((h,i)=>{if(o[h]===undefined||o[h]==='')o[h]=c[i]});return o})}
function kindOf(name,text){const s=(name+' '+text.slice(0,200)).toLowerCase();
  if(/step_daily_trend/.test(s))return'steptrend';if(/pedometer_day_summary/.test(s))return'stepday';
  if(/sleep_stage|sleep_combined|sleep_snoring|sleep_goal/.test(s))return null;
  if(/(health|shealth)\.step_count/.test(s))return'steps';if(/tracker\.heart_rate|health\.heart_rate/.test(s))return'hr';
  if(/health\.weight/.test(s))return'weight';if(/shealth\.sleep[.,]/.test(s)||/health\.sleep[.,]/.test(s))return'sleep';
  if(/shealth\.exercise[.,]/.test(s)&&!/exercise\.(weather|recovery|routine|custom|periodization|max_heart)/.test(s))return'exercise';return null}
function localDay(t,off){if(!t)return null;let ms;
  if(/^\d{10,}$/.test(t))ms=+t;else{ms=Date.parse(t.trim().replace(' ','T')+(/[zZ]|[+-]\d\d:?\d\d$/.test(t)?'':'Z'));if(isNaN(ms))return null;
    const m=/UTC([+-])(\d\d)(\d\d)/.exec(off||'');if(m)ms+=(m[1]==='-'?-1:1)*(+m[2]*60+ +m[3])*6e4;else ms-=new Date().getTimezoneOffset()*6e4}
  return new Date(ms).toISOString().slice(0,10)}
const msOf=t=>/^\d{10,}$/.test(t||'')?+t:Date.parse(String(t).trim().replace(' ','T')+'Z');
async function readHealthFiles(files){
  const texts=[];
  for(const f of files){
    if(/\.zip$/i.test(f.name)){await loadJSZip();const z=await JSZip.loadAsync(f);
      for(const n of Object.keys(z.files))if(/\.csv$/i.test(n)&&!z.files[n].dir)texts.push([n,await z.files[n].async('string')])}
    else if(/\.csv$/i.test(f.name))texts.push([f.webkitRelativePath||f.name,await f.text()])}
  const D={},stepsRaw={},hr={},ex=[],wts={};let used=0;
  const day=k=>D[k]=D[k]||{};
  for(const[name,text]of texts){const kind=kindOf(name,text);if(!kind)continue;const rows=parseCSV(text);if(!rows.length)continue;used++;
    for(const r of rows){
      if(kind==='steptrend'){if(r.source_type!==undefined&&r.source_type!==''&&r.source_type!=='-2')continue;const d=localDay(r.day_time);if(!d)continue;const o=day(d);o.steps=Math.max(o.steps||0,+r.count||0);if(r.distance)o.dist=Math.max(o.dist||0,+r.distance);if(r.calorie)o.kcal=Math.max(o.kcal||0,+r.calorie)}
      else if(kind==='stepday'){const d=localDay(r.day_time||r.create_time,r.time_offset);if(!d)continue;const o=day(d);o.steps=Math.max(o.steps||0,+r.step_count||0);if(r.distance)o.dist=Math.max(o.dist||0,+r.distance);if(r.calorie)o.kcal=Math.max(o.kcal||0,+r.calorie)}
      else if(kind==='steps'){const d=localDay(r.start_time,r.time_offset);if(d)stepsRaw[d]=(stepsRaw[d]||0)+(+r.count||0)}
      else if(kind==='hr'){const d=localDay(r.start_time,r.time_offset),v=+r.heart_rate;if(d&&v>25&&v<230)(hr[d]=hr[d]||[]).push(v)}
      else if(kind==='weight'){const d=localDay(r.start_time||r.create_time,r.time_offset),v=+r.weight;if(d&&v>25&&v<300)wts[d]=v}
      else if(kind==='sleep'){const a=msOf(r.start_time),b=msOf(r.end_time),d=localDay(r.end_time,r.time_offset);if(d&&b>a&&b-a<20*36e5)day(d).sleep=+(((day(d).sleep||0)+(b-a)/36e5)).toFixed(2)}
      else if(kind==='exercise'){const d=localDay(r.start_time,r.time_offset),min=Math.round((+r.duration||0)/6e4);if(d&&min>0)ex.push({date:d,type:EXTYPES[r.exercise_type]||'Exercício',min,kcal:Math.round(+r.calorie||0),hr:Math.round(+r.mean_heart_rate||0)})}
    }}
  for(const d in stepsRaw){const o=day(d);if(!o.steps)o.steps=Math.round(stepsRaw[d])}
  for(const d in hr){const v=hr[d].sort((a,b)=>a-b),o=day(d);o.hrRest=v[Math.floor(v.length*.1)];o.hrAvg=Math.round(v.reduce((s,x)=>s+x,0)/v.length);o.hrMax=v[v.length-1]}
  return{days:D,ex,wts,used,files:texts.length};
}
let jszipP=null;
function loadJSZip(){if(window.JSZip)return Promise.resolve();return jszipP=jszipP||new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';s.onload=ok;s.onerror=()=>no(new Error('zip'));document.head.appendChild(s)})}
function mergeHealth(res){
  const H=S.health=S.health||{days:{},ex:[],goal:8000,awarded:{}};
  for(const d in res.days)H.days[d]=Object.assign(H.days[d]||{},res.days[d]);
  const keys=Object.keys(H.days).sort();for(const k of keys.slice(0,Math.max(0,keys.length-120)))delete H.days[k];
  const seen=new Set(H.ex.map(e=>e.date+e.type+e.min));for(const e of res.ex)if(!seen.has(e.date+e.type+e.min))H.ex.push(e);
  H.ex.sort((a,b)=>a.date.localeCompare(b.date));H.ex=H.ex.slice(-40);
  let nw=0;for(const d in res.wts){if(!S.weights.find(w=>w.date===d)){S.weights.push({date:d,kg:res.wts[d]});nw++}}
  S.weights.sort((a,b)=>a.date.localeCompare(b.date));if(nw&&S.profile)S.profile.weight=S.weights[S.weights.length-1].kg;
  H.updated=Date.now();
  // XP: 15 por dia em que bateu a meta de passos (últimos 30 dias, uma vez por dia)
  let xp=0,n=0;const lim=todayISO(new Date(Date.now()-30*DAY));
  for(const d in H.days)if(d>=lim&&(H.days[d].steps||0)>=H.goal&&!H.awarded[d]){H.awarded[d]=1;xp+=15;n++}
  S.xp+=xp;return{xp,n,nw};
}
const hDays=()=>S.health?Object.keys(S.health.days).sort():[];
function healthRest(){if(!S.health)return null;const v=hDays().slice(-14).map(d=>S.health.days[d].hrRest).filter(Boolean);if(!v.length)return null;v.sort((a,b)=>a-b);return v[Math.floor(v.length/2)]}
function healthLatest(f){const ks=hDays();for(let i=ks.length-1;i>=0;i--){const v=S.health.days[ks[i]][f];if(v)return[ks[i],v]}return null}
const dm=d=>`${d.slice(8,10)}/${d.slice(5,7)}`;
const ageDays=()=>S.health?Math.floor((Date.now()-S.health.updated)/DAY):0;

function healthHomeCard(){if(!S.health)return'';const H=S.health,st=healthLatest('steps'),sl=healthLatest('sleep'),rest=healthRest();
  const pct=st?Math.min(100,st[1]/H.goal*100):0;
  const tip=sl&&sl[1]<6?'Você dormiu pouco. Hoje vale um treino mais leve: mantenha as cargas e descanse um pouco mais entre as séries.':st&&st[1]>=H.goal?'Meta de passos batida nesse dia. Ótimo para o coração!':'';
  return`<section class="card stack"><div class="row between"><h2>Saúde</h2><span class="tag">Samsung Health</span></div>
   ${st?`<div><div class="row between"><span>Passos em ${dm(st[0])}</span><b class="num" style="font-family:var(--f-display);font-size:1.4rem">${fmt(st[1])}<small class="muted" style="font-size:.85rem"> / ${fmt(H.goal)}</small></b></div><div class="bar"><i style="width:${pct}%"></i></div></div>`:''}
   <div class="tiles">${sl?`<div class="tile"><div class="v num">${fmt(sl[1],1)}<small>h</small></div><div class="k">sono em ${dm(sl[0])}</div></div>`:''}${rest?`<div class="tile"><div class="v num">${rest}<small>bpm</small></div><div class="k">FC de repouso (estimada)</div></div>`:''}</div>
   ${tip?`<p class="note">${tip}</p>`:''}
   ${ageDays()>=3?`<p class="note">Dados de ${ageDays()} dias atrás. <button class="linkbtn" data-go="perfil">Atualizar</button></p>`:''}</section>`}

function healthProgCard(){if(!S.health)return'';const H=S.health,ks=[];for(let i=13;i>=0;i--)ks.push(todayISO(new Date(Date.now()-i*DAY)));
  const vals=ks.map(d=>(H.days[d]||{}).steps||0),mx=Math.max(H.goal*1.2,...vals),bw=290/14,Y=v=>110-v/mx*95;
  const bars=ks.map((d,i)=>{const v=vals[i],y=Y(v);return`<rect x="${30+i*bw+3}" y="${y}" width="${bw-6}" height="${110-y}" rx="2" fill="${v>=H.goal?'var(--accent)':'var(--metal)'}"/>${i%2?'':`<text x="${30+i*bw+bw/2}" y="124" text-anchor="middle">${dm(d)}</text>`}`}).join('');
  const sleeps=ks.map(d=>(H.days[d]||{}).sleep).filter(Boolean),avgS=sleeps.length?sleeps.reduce((a,b)=>a+b,0)/sleeps.length:null;
  const ex=H.ex.slice(-5).reverse();
  return`<section class="card stack"><div><h2>Passos · 14 dias</h2><p class="muted" style="font-size:.85rem">Do Samsung Health. Laranja = meta de ${fmt(H.goal)} batida (+15 XP por dia)</p></div>
  <svg class="chart" viewBox="0 0 330 130" role="img" aria-label="Passos nos últimos 14 dias"><line class="gl" x1="30" x2="320" y1="110" y2="110"/><line x1="30" x2="320" y1="${Y(H.goal)}" y2="${Y(H.goal)}" stroke="var(--accent)" stroke-dasharray="4 3"/><text x="26" y="${Y(H.goal)+3}" text-anchor="end">${fmt(H.goal/1000)}k</text>${bars}</svg>
  ${avgS?`<div class="row between"><span>Sono médio</span><b class="num">${fmt(avgS,1)} h por noite</b></div>`:''}
  ${healthRest()?`<div class="row between"><span>FC de repouso</span><b class="num">${healthRest()} bpm</b></div>`:''}
  ${ex.length?`<div><p class="eyebrow">Atividades do relógio/celular</p><div class="prlist">${ex.map(e=>`<div class="r"><span>${esc(e.type)}<br><small class="muted">${dm(e.date)}${e.hr?' · FC média '+e.hr:''}</small></span><b class="num">${e.min} min${e.kcal?' · '+e.kcal+' kcal':''}</b></div>`).join('')}</div></div>`:''}</section>`}

function healthPerfilCard(){const H=S.health;
  if(!H)return`<section class="card stack"><div class="row between"><h2>Samsung Health</h2><span class="tag">Opcional</span></div>
   <p class="muted" style="font-size:.95rem">Traga passos, batimentos, sono, peso e atividades do seu celular ou relógio Samsung. O app usa isso para ajustar a zona do cardio, dar XP pelos passos e avisar quando você dormiu pouco.</p>
   <button class="btn primary" id="h-connect">Conectar Samsung Health</button></section>`;
  const ks=hDays();
  return`<section class="card stack"><div class="row between"><h2>Samsung Health</h2><span class="tag" style="color:var(--good)">Conectado</span></div>
   <p class="muted" style="font-size:.9rem">${ks.length} dias de dados (${ks.length?dm(ks[0])+' a '+dm(ks[ks.length-1]):'—'}). Última importação há ${ageDays()===0?'menos de 1 dia':ageDays()+' dia(s)'}.</p>
   <div class="field"><span>Meta de passos por dia</span><div class="chips" id="h-goal">${[6000,8000,10000,12000].map(g=>`<button class="chip" data-g="${g}" aria-pressed="${H.goal===g}">${fmt(g)}</button>`).join('')}</div></div>
   <div class="row wrap"><button class="btn primary sm" id="h-connect">Atualizar dados</button><button class="btn sm ghost" id="h-off">Desconectar</button></div></section>`}
function bindHealthPerfil(){
  $('#h-connect')&&($('#h-connect').onclick=openHealthImport);
  $('#h-goal')&&($('#h-goal').onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;S.health.goal=+b.dataset.g;save();render()});
  $('#h-off')&&($('#h-off').onclick=()=>{const close=openSheet(`<button class="x" data-close aria-label="Fechar">×</button><h2>Desconectar o Samsung Health?</h2><p class="muted" style="margin:8px 0 16px">Os dados de saúde importados serão apagados do app. Pesos já registrados e XP ganho continuam.</p><div class="row"><button class="btn" data-close style="flex:1">Cancelar</button><button class="btn primary" id="really" style="flex:1">Desconectar</button></div>`);
    $('#really').onclick=()=>{delete S.health;save();close();render()}});
}
function openHealthImport(){
  openSheet(`<button class="x" data-close aria-label="Fechar">×</button>
  <p class="eyebrow">Samsung Health · opcional</p><h2 style="font-size:1.8rem">Importar seus dados</h2>
  <p class="muted" style="margin-top:6px">A Samsung não permite que apps web leiam o Samsung Health diretamente. Por isso você exporta os dados no celular e escolhe os arquivos aqui. Leva 1 minuto e pode repetir quando quiser atualizar.</p>
  <div class="sec"><h3>No celular</h3><ol class="steps">
   <li>Abra o <b>Samsung Health</b> e toque no menu (☰ ou ⋮) e depois em <b>Configurações</b>.</li>
   <li>Toque em <b>Baixar dados pessoais</b> e confirme. Pode pedir a senha da conta Samsung.</li>
   <li>Os arquivos vão para a pasta <b>Download › Samsung Health</b> do celular.</li>
   <li>Toque no botão abaixo e selecione <b>todos os arquivos .csv</b> dessa pasta (ou um .zip dela).</li></ol></div>
  <label class="btn primary big" style="margin-top:16px" for="h-file">Escolher arquivos</label>
  <input id="h-file" type="file" multiple accept=".csv,.zip,text/csv,application/zip" hidden>
  <p class="note" id="h-status" style="margin-top:10px">O app lê passos, batimentos, sono, peso e exercícios e guarda só um resumo por dia. Nada é enviado para outros serviços.</p>`);
  $('#h-file').onchange=async e=>{const files=[...e.target.files];if(!files.length)return;const st=$('#h-status');st.textContent='Lendo '+files.length+' arquivo(s)...';
    try{const res=await readHealthFiles(files);
      if(!res.used){st.textContent='Não encontrei dados do Samsung Health nesses arquivos. Selecione os arquivos .csv da pasta Download › Samsung Health (nomes começam com com.samsung).';return}
      const first=!S.health,r=mergeHealth(res);const mis=claimAll(),ach=checkAch();save();
      $('#layer').innerHTML='';route=first?'home':route;render();scrollTo(0,0);
      toast(`Importado: ${Object.keys(res.days).length} dias${r.nw?', '+r.nw+' pesos':''}${r.xp?' · +'+r.xp+' XP pelos passos':''}`,4000);
      if(ach.length||mis.length)confetti();
    }catch(err){st.textContent=err&&err.message==='zip'?'Não consegui abrir o .zip. Selecione os arquivos .csv diretamente.':'Não consegui ler esses arquivos. Tente selecionar os .csv da pasta Download › Samsung Health.'}};
}

render();
</script>
